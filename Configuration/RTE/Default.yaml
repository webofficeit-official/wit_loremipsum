# TYPO3 core default preset extended by the Lorem Ipsum button.
# Lists are appended on import, so the button is added after the core toolbar items.
imports:
    - { resource: "EXT:rte_ckeditor/Configuration/RTE/Default.yaml" }
    - { resource: "EXT:wit_loremipsum/Configuration/RTE/Plugin.yaml" }

editor:
  config:
    toolbar:
      items:
        - '|'
        - loremIpsum
